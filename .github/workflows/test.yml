name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:  # the oldest Python Orbit supports (newer Ubuntu images no longer offer it)
          - os: ubuntu-22.04
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # bash is Git Bash on Windows, the shell Claude Code runs hooks in there
      - name: End-to-end check
        shell: bash
        run: python tests/smoke.py
